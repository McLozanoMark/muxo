<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" role="img" aria-labelledby="muxo-logo-title muxo-logo-description">
  <title id="muxo-logo-title">Muxo</title>
  <desc id="muxo-logo-description">Tres barras verdes junto a la palabra Muxo con animación de levitación y brillo.</desc>
  <defs>
    <linearGradient id="muxo-bars" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7ff83"/>
      <stop offset=".48" stop-color="#c9f52b"/>
      <stop offset="1" stop-color="#8db516"/>
    </linearGradient>
    <linearGradient id="muxo-word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ded7e2"/>
    </linearGradient>
    <linearGradient id="muxo-sheen" gradientUnits="userSpaceOnUse" x1="-120" y1="0" x2="-38" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".56" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-120;430;-120" dur="6.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-38;512;-38" dur="6.8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="muxo-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="muxo-word-clip">
      <text x="98" y="62" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" letter-spacing="8">MUXO</text>
    </clipPath>
  </defs>

  <g fill="url(#muxo-bars)" filter="url(#muxo-glow)">
    <path d="M18 70h14l22-52H40z">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0;0 .7;0 0" dur="4.8s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M40 70h14l22-52H62z">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 .8;0 0;0 -1.8;0 0" dur="5.5s" begin="-.8s" repeatCount="indefinite"/>
    </path>
    <path d="M62 70h14l22-52H84z">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.1;0 0;0 1.3;0 0" dur="5.1s" begin="-1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="98" y="62" fill="url(#muxo-word)" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" letter-spacing="8">MUXO</text>
  <rect x="98" y="17" width="218" height="52" fill="url(#muxo-sheen)" clip-path="url(#muxo-word-clip)" opacity=".6"/>
</svg>
